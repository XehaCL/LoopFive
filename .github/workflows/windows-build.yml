name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile .NET Framework application
        shell: powershell
        run: .\BUILD.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LoopFive-windows-x64
          path: src/build/LoopFive.exe
